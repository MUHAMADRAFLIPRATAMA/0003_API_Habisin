server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Semua panggilan API diteruskan ke container FastAPI, jadi file web tidak
    # menyimpan alamat host apa pun.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Halaman pembayaran QR (/pesanan/bayar/...) dan endpoint API juga dilayani
    # langsung, supaya URL yang dibuka HP — termasuk lewat tunnel Cloudflare —
    # menampilkan halaman bayar, bukan index web.
    location ~ ^/(pesanan|keranjang|auth|produk|favorit|ulasan|toko|ai|media|struk|health|docs|openapi\.json)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
