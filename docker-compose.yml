services:
  db:
    image: mysql:8.0
    container_name: habisin-db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-habisin_local}
      MYSQL_DATABASE: habisin
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-habisin_local}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habisin-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-habisin_local}@db:3306/habisin
      TZ: Asia/Jakarta
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./media:/app/media
      # IP LAN host ditulis oleh `python update_host_ip.py`; dipakai backend
      # untuk menyusun URL di dalam QR pembayaran agar bisa dibuka HP.
      - ./hostnet:/app/hostnet:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    image: nginx:alpine
    container_name: habisin-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "0.0.0.0:8081:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Tunnel cepat Cloudflare (tanpa akun). URL acak *.trycloudflare.com muncul di
  # `docker compose logs tunnel`. Cocok untuk demo singkat.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: habisin-tunnel
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://web:80

  # Tunnel permanen dengan domain sendiri (URL tidak berubah walau restart).
  # Aktifkan dengan:
  #   docker compose stop tunnel
  #   docker compose --profile named up -d tunnel-named
  # Butuh CLOUDFLARE_TUNNEL_TOKEN (connector token, diawali "eyJ") di .env
  tunnel-named:
    image: cloudflare/cloudflared:latest
    container_name: habisin-tunnel-named
    restart: unless-stopped
    profiles: ["named"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared:ro
    command: tunnel --no-autoupdate --config /home/nonroot/.cloudflared/config.yml run
